name: CI (macOS)
# macOS tests. macOS arm64 tracks differ numerically from the x86-64 reference outputs (see docs/user_guide.md,
# "Platforms"), so this workflow is informational and gates nothing. Runs by hand only.
on:
  workflow_dispatch:

env:
  CUDA_VISIBLE_DEVICES: "-1"
  OPENCV_OPENCL_RUNTIME: disabled
  PYTHONHASHSEED: "0"
  MPLBACKEND: Agg
  PYTHONIOENCODING: utf-8

jobs:
  cpu:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python: ["3.11", "3.13"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        # [test] extra = pytest, pandas, hypothesis
        run: python -m pip install -r requirements.txt ".[test]"
      - name: compileall, import, --help, CPU smoke (tools/ci/install_check.sh)
        env:
          SKIP_VENV: "1"
        run: tools/ci/install_check.sh python "$RUNNER_TEMP/install_check"
      - name: pytest (not gpu, not slow)
        if: hashFiles('tests/**') != ''
        # faulthandler_timeout: a test stuck > 300 s dumps every thread's stack (hang diagnosis);
        # -v on macOS so the log shows which test is running.
        run: >-
          python -m pytest ${{ runner.os == 'macOS' && '-v' || '-q' }} -m "not gpu and not slow" -p no:cacheprovider
          --durations=10 -o faulthandler_timeout=300

  slow-parity:
    name: ${{ matrix.os }} / py3.11 / slow fixture parity + platform metrics
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: python -m pip install -r requirements.txt ".[test]"
      - name: decode probe (OpenCV backend + first-frame hashes per fixture clip)
        run: python tools/ci/frame_probe.py
      - name: pytest (slow, not gpu)
        run: >-
          python -m pytest ${{ runner.os == 'macOS' && '-v' || '-q' }} -m "slow and not gpu" -p no:cacheprovider
          --durations=10 -o faulthandler_timeout=600
      - name: parity report (byte-identical / ids-only / different per fixture), on failure
        if: failure()
        run: python tools/ci/parity_report.py "$RUNNER_TEMP/parity" --summary "$GITHUB_STEP_SUMMARY"
      - name: upload the CPU runs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: parity-${{ matrix.os }}
          path: ${{ runner.temp }}/parity
      # Metric differences vs the goldens (not only "bytes differ"), every run, to the step summary + artifact.
      - name: platform metrics vs goldens (tools/ci/platform_metrics.py)
        if: always()
        run: >-
          python tools/ci/platform_metrics.py "$RUNNER_TEMP/metrics" --run --summary "$GITHUB_STEP_SUMMARY"
          --csv "$RUNNER_TEMP/metrics/platform_metrics.csv"
      - name: upload platform metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-metrics-${{ matrix.os }}
          path: ${{ runner.temp }}/metrics/platform_metrics.csv
