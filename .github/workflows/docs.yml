name: Docs
# Builds the documentation site and runs the five-minute tutorial as written. Runs by hand only.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NO_MKDOCS_2_WARNING: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/docs/requirements.txt
      - run: python -m pip install -r tools/docs/requirements.txt
      - name: mkdocs build --strict
        run: mkdocs build --strict -d site
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # docs/tutorial_fixture.md executed as written (pip install ., cbtv ..., cmp against the golden).
  tutorial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: "-1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python tools/docs/run_tutorial.py

  # Publishing needs Settings > Pages > Source = "GitHub Actions".
  # Until the repo variable PAGES_ENABLED is set to "true" this workflow is build-only (site = artifact above).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: [build, tutorial]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
